<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/glowalchemy-logo.png" />
    <link rel="apple-touch-icon" href="/glowalchemy-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#143D2B" />
    <meta name="description" content="%BRAND_NAME% — Premium natural beauty and lifestyle store" />
    <meta property="og:title" content="%BRAND_NAME%" />
    <meta property="og:description" content="%BRAND_NAME% — Premium natural beauty and lifestyle store" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png" />
    <!-- Meta Pixel loaded via React SDK for better control -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Non-render-blocking font load: swap to fallback immediately (prevents
         font-swap CLS), fetch the stylesheet after first paint. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet" />
    </noscript>
    <link rel="manifest" href="/manifest.json" />
    <title>%BRAND_NAME%</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
