# GlowAlchemy frontend — Nginx site configuration.
#
# Serves the Vite build output (dist/). Route-specific prerendered shells
# (dist/<route>/index.html, generated by scripts/prerender-routes.mjs) are
# served DIRECTLY at their canonical non-trailing-slash URLs:
#
#   try_files order matters:
#     $uri                 -> real files (assets, verification html, etc.)
#     $uri/index.html      -> generated route shells -> HTTP 200, NO redirect
#     $uri/                -> directory index fallback
#     /index.html          -> SPA fallback (product slugs, client nav, 404s)
#
# Without the $uri/index.html step, nginx answers /about with a 301 to
# /about/ (directory-slash redirect), splitting the canonical URL.
#
# Cache contract (verified):
#   - HTML shells: Cache-Control: no-cache  (always revalidated)
#   - /assets/*:   1y + immutable           (content-hashed filenames)
#   - missing assets: 404                   (never the SPA fallback)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets — long-lived immutable cache, strict 404.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else: files, then route shells, then SPA fallback.
    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
